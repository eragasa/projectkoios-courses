[project]
name = "projectkoios-courses"
version = "0.0.0"
description = "Course modeling and evidence-backed authoring for Project Koios"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
authors = [
    { name = "Eugene Ragasa", email = "eugene@projectkoios.com" },
]

[project.scripts]
koios-course-sanitize = "projectkoios.courses.cli:main"
koios-course-propose-conversion-intent = "projectkoios.courses.problem_solving.conversion_intent_cli:main"

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/python"]
namespaces = true

[tool.setuptools.package-data]
"projectkoios.courses" = ["py.typed"]

[project.optional-dependencies]
computation = ["sympy==1.14.0"]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
mypy_path = "src/python"
namespace_packages = true
explicit_package_bases = true
strict = true
files = ["src/python", "tests"]
